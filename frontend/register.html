<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>Sajili Wakala Mpya</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
</head>
<body class="auth-body">
    <div class="login-card">
        <h2>Sajili Wakala Mpya</h2>
        <form id="registerForm">
            <div class="form-group"><label>Jina Kamili</label><input type="text" id="fullName" required></div>
            <div class="form-group"><label>Username</label><input type="text" id="regUsername" required></div>
            <div class="form-group"><label>Namba ya Simu</label><input type="text" id="phone" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="regPassword" required></div>
            <button type="submit" class="btn-primary">Tengeneza Akaunti</button>
        </form>
        <p style="margin-top:15px; text-align:center;"><a href="login.html">Rudi Kwenye Login</a></p>
    </div>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
